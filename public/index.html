<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 40px;
      width: 100%;
      max-width: 680px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 28px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="url"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus {
      border-color: #4f46e5;
    }

    button {
      padding: 10px 20px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }

    #status {
      margin-top: 24px;
      font-size: 0.9rem;
    }

    .loading { color: #666; }
    .error { color: #dc2626; }

    #results {
      margin-top: 24px;
    }

    .results-header {
      font-size: 0.85rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .result-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-list li {
      background: #f8f9fb;
      border: 1px solid #e8eaed;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #1a1a2e;
    }

    .empty {
      color: #888;
      font-size: 0.9rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>URL Analyzer</h1>
    <p class="subtitle">Enter a URL to extract product titles (<code>h3.product__title</code>) from the page.</p>

    <form id="form">
      <div class="input-row">
        <input type="url" id="url" placeholder="https://example.com/products" required>
        <button type="submit" id="btn">Analyze</button>
      </div>
    </form>

    <div id="status"></div>
    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const urlInput = document.getElementById('url');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    const results = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = urlInput.value.trim();

      btn.disabled = true;
      status.innerHTML = '<span class="loading">Fetching page...</span>';
      results.innerHTML = '';

      try {
        const res = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          status.innerHTML = `<span class="error">${escapeHtml(data.error)}</span>`;
          return;
        }

        status.innerHTML = '';

        if (data.results.length === 0) {
          results.innerHTML = '<p class="empty">No <code>h3.product__title</code> elements found on this page.</p>';
        } else {
          results.innerHTML = `
            <div class="results-header">${data.results.length} result${data.results.length !== 1 ? 's' : ''}</div>
            <ul class="result-list">
              ${data.results.map(r => `<li>${escapeHtml(r)}</li>`).join('')}
            </ul>
          `;
        }
      } catch (err) {
        status.innerHTML = `<span class="error">Request failed: ${escapeHtml(err.message)}</span>`;
      } finally {
        btn.disabled = false;
      }
    });

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
